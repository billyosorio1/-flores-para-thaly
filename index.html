<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Thaly ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #07100a;
    color: white;
}

/* =========================
   ESCENA PRINCIPAL
========================= */

.scene {
    position: relative;
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 75%, rgba(55, 91, 38, 0.35), transparent 35%),
        linear-gradient(to bottom, #07100a 0%, #102016 45%, #172d16 100%);
}

/* =========================
   ESTRELLAS
========================= */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 3s infinite ease-in-out;
}

.star:nth-child(1) { top: 8%; left: 12%; animation-delay: 0s; }
.star:nth-child(2) { top: 15%; left: 27%; animation-delay: 1s; }
.star:nth-child(3) { top: 10%; left: 52%; animation-delay: 2s; }
.star:nth-child(4) { top: 22%; left: 70%; animation-delay: .5s; }
.star:nth-child(5) { top: 7%; left: 84%; animation-delay: 1.5s; }
.star:nth-child(6) { top: 32%; left: 8%; animation-delay: 2.5s; }
.star:nth-child(7) { top: 28%; left: 92%; animation-delay: 1s; }
.star:nth-child(8) { top: 38%; left: 35%; animation-delay: .3s; }
.star:nth-child(9) { top: 17%; left: 42%; animation-delay: 1.8s; }
.star:nth-child(10) { top: 30%; left: 62%; animation-delay: 2.2s; }
.star:nth-child(11) { top: 12%; left: 95%; animation-delay: .8s; }
.star:nth-child(12) { top: 40%; left: 78%; animation-delay: 1.2s; }

@keyframes twinkle {
    0%, 100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* =========================
   LUNA
========================= */

.moon {
    position: absolute;
    top: 8%;
    right: 9%;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #fff8cf;
    box-shadow:
        0 0 25px rgba(255, 248, 207, .45),
        0 0 60px rgba(255, 240, 150, .12);
}

.moon::after {
    content: "";
    position: absolute;
    top: -4px;
    left: -13px;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #07100a;
}

/* =========================
   INTRO
========================= */

.intro {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    transition:
        opacity .7s ease,
        transform .7s ease;
}

.intro.hidden {
    opacity: 0;
    transform: scale(.96);
    pointer-events: none;
    position: absolute;
    inset: 0;
}

.card {
    width: min(90%, 430px);
    padding: 45px 30px;
    text-align: center;
    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.035)
        );

    border: 1px solid rgba(255,255,255,.15);

    box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.08);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}

.small-text {
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #e6dca2;
    margin-bottom: 18px;
}

.card h1 {
    font-size: clamp(38px, 11vw, 58px);
    font-weight: normal;
    color: #fff8c7;
    text-shadow: 0 0 20px rgba(255, 225, 100, .15);
    margin-bottom: 18px;
}

.card p {
    font-size: 17px;
    line-height: 1.7;
    color: rgba(255,255,255,.82);
    margin-bottom: 30px;
}

/* =========================
   BOTÓN
========================= */

.open {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    min-width: 150px;
    padding: 14px 28px;

    border: none;
    border-radius: 50px;

    background: #f4cf54;
    color: #302a0c;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(244, 207, 84, .18);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.open:hover {
    transform: translateY(-3px);
    background: #ffe276;

    box-shadow:
        0 12px 35px rgba(244, 207, 84, .3);
}

.open:active {
    transform: scale(.96);
}

/* =========================
   JARDÍN
========================= */

.garden {
    position: absolute;
    inset: 0;

    opacity: 0;
    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.garden.show {
    opacity: 1;
    visibility: visible;
}

/* =========================
   MENSAJE
========================= */

.message {
    position: absolute;
    z-index: 8;

    top: 10%;
    left: 50%;

    width: 90%;
    max-width: 600px;

    transform: translateX(-50%);

    text-align: center;

    color: #fff7c9;

    opacity: 0;
    animation: messageIn 1.5s ease forwards;
    animation-delay: .5s;
}

.message h2 {
    font-size: clamp(28px, 8vw, 46px);
    font-weight: normal;
    margin-bottom: 15px;

    text-shadow:
        0 0 20px rgba(255, 228, 111, .18);
}

.message p {
    font-size: clamp(15px, 4vw, 18px);
    line-height: 1.7;
    color: rgba(255,255,255,.84);
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}

/* =========================
   SUELO
========================= */

.ground {
    position: absolute;
    bottom: -8%;
    left: -10%;

    width: 120%;
    height: 35%;

    background:
        radial-gradient(
            ellipse at center,
            #213c1c 0%,
            #132713 55%,
            #0b180c 100%
        );

    border-radius: 50% 50% 0 0;
}

/* =========================
   PASTO
========================= */

.grass {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 23%;
    pointer-events: none;
}

.grass::before,
.grass::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100%;

    background:
        repeating-linear-gradient(
            80deg,
            transparent 0 15px,
            rgba(80, 125, 48, .35) 16px 18px,
            transparent 19px 30px
        );
}

/* =========================
   GIRASOLES
========================= */

.sunflower {
    position: absolute;
    bottom: 15%;
    width: 150px;
    height: 300px;
    transform-origin: bottom center;
}

.sf-left {
    left: 5%;
    transform: scale(.78) rotate(-5deg);
}

.sf-center {
    left: 50%;
    bottom: 10%;
    transform: translateX(-50%) scale(1);
}

.sf-right {
    right: 3%;
    transform: scale(.82) rotate(5deg);
}

/* TALLO */

.stem {
    position: absolute;

    bottom: 0;
    left: 50%;

    width: 10px;
    height: 210px;

    transform: translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            to right,
            #294d1d,
            #5d8233,
            #294d1d
        );
}

/* HOJAS */

.leaf {
    position: absolute;

    width: 65px;
    height: 30px;

    background: #47752b;

    border-radius: 100% 0 100% 0;
}

.leaf.left {
    bottom: 100px;
    left: 18px;
    transform: rotate(25deg);
}

.leaf.right {
    bottom: 135px;
    right: 12px;
    transform: scaleX(-1) rotate(25deg);
}

/* FLOR */

.flower {
    position: absolute;

    top: 0;
    left: 50%;

    width: 130px;
    height: 130px;

    transform: translateX(-50%);
}

.petals {
    position: absolute;
    inset: 0;
}

/* PÉTALOS */

.petal {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 42px;
    height: 70px;

    transform-origin: 50% 90%;

    border-radius: 50% 50% 45% 45%;

    background:
        linear-gradient(
            to bottom,
            #ffe86a,
            #f5c52d 65%,
            #d99e15
        );

    box-shadow:
        inset 0 -4px 6px rgba(139, 88, 0, .18);
}

.petal:nth-child(1) {
    transform: translate(-50%, -90%) rotate(0deg);
}

.petal:nth-child(2) {
    transform: translate(-50%, -90%) rotate(30deg);
}

.petal:nth-child(3) {
    transform: translate(-50%, -90%) rotate(60deg);
}

.petal:nth-child(4) {
    transform: translate(-50%, -90%) rotate(90deg);
}

.petal:nth-child(5) {
    transform: translate(-50%, -90%) rotate(120deg);
}

.petal:nth-child(6) {
    transform: translate(-50%, -90%) rotate(150deg);
}

.petal:nth-child(7) {
    transform: translate(-50%, -90%) rotate(180deg);
}

.petal:nth-child(8) {
    transform: translate(-50%, -90%) rotate(210deg);
}

.petal:nth-child(9) {
    transform: translate(-50%, -90%) rotate(240deg);
}

.petal:nth-child(10) {
    transform: translate(-50%, -90%) rotate(270deg);
}

.petal:nth-child(11) {
    transform: translate(-50%, -90%) rotate(300deg);
}

.petal:nth-child(12) {
    transform: translate(-50%, -90%) rotate(330deg);
}

/* PÉTALOS INTERIORES */

.petal.inner {
    width: 31px;
    height: 54px;

    background:
        linear-gradient(
            to bottom,
            #ffd94c,
            #eeb41f
        );
}

.petal.inner:nth-child(13) {
    transform: translate(-50%, -85%) rotate(15deg);
}

.petal.inner:nth-child(14) {
    transform: translate(-50%, -85%) rotate(60deg);
}

.petal.inner:nth-child(15) {
    transform: translate(-50%, -85%) rotate(105deg);
}

.petal.inner:nth-child(16) {
    transform: translate(-50%, -85%) rotate(150deg);
}

.petal.inner:nth-child(17) {
    transform: translate(-50%, -85%) rotate(195deg);
}

.petal.inner:nth-child(18) {
    transform: translate(-50%, -85%) rotate(240deg);
}

.petal.inner:nth-child(19) {
    transform: translate(-50%, -85%) rotate(285deg);
}

.petal.inner:nth-child(20) {
    transform: translate(-50%, -85%) rotate(330deg);
}

/* CENTRO DEL GIRASOL */

.center {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 53px;
    height: 53px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #9c6925 0 5%,
            transparent 6%
        ),
        radial-gradient(
            circle at 60% 65%,
            #553415 0 6%,
            transparent 7%
        ),
        radial-gradient(
            circle,
            #5d3918 0%,
            #38220f 75%
        );

    box-shadow:
        inset 0 0 0 5px rgba(36, 21, 7, .45),
        0 0 10px rgba(0,0,0,.3);
}

/* =========================
   LUCI / LUCIÉRNAGAS
========================= */

.firefly {
    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: #fff5a1;

    box-shadow:
        0 0 8px #fff5a1,
        0 0 20px rgba(255, 230, 100, .65);

    animation:
        float 5s ease-in-out infinite,
        glow 2s ease-in-out infinite;
}

.firefly:nth-child(1) {
    left: 20%;
    bottom: 40%;
    animation-delay: 0s;
}

.firefly:nth-child(2) {
    left: 72%;
    bottom: 47%;
    animation-delay: 1.5s;
}

.firefly:nth-child(3) {
    left: 82%;
    bottom: 32%;
    animation-delay: 2.5s;
}

.firefly:nth-child(4) {
    left: 35%;
    bottom: 50%;
    animation-delay: 3s;
}

.firefly:nth-child(5) {
    left: 58%;
    bottom: 38%;
    animation-delay: 1s;
}

@keyframes float {
    0%, 100% {
        transform: translate(0, 0);
    }

    50% {
        transform: translate(15px, -25px);
    }
}

@keyframes glow {
    0%, 100% {
        opacity: .3;
    }

    50% {
        opacity: 1;
    }
}

/* =========================
   ANIMACIÓN FLORES
========================= */

.sunflower {
    animation: flowerAppear 1.8s ease both;
}

.sf-left {
    animation-delay: .2s;
}

.sf-center {
    animation-delay: .4s;
}

.sf-right {
    animation-delay: .6s;
}

@keyframes flowerAppear {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.7);
    }

    to {
        opacity: 1;
    }
}

/* =========================
   MÓVIL
========================= */

@media (max-width: 600px) {

    .moon {
        top: 5%;
        right: 6%;
        width: 58px;
        height: 58px;
    }

    .moon::after {
        width: 58px;
        height: 58px;
        left: -10px;
    }

    .card {
        padding: 38px 22px;
    }

    .card h1 {
        font-size: 45px;
    }

    .card p {
        font-size: 16px;
    }

    .message {
        top: 7%;
        width: 88%;
    }

    .message h2 {
        font-size: 30px;
    }

    .message p {
        font-size: 15px;
    }

    .sunflower {
        bottom: 13%;
    }

    .sf-left {
        left: -15px;
        transform: scale(.58) rotate(-5deg);
    }

    .sf-center {
        left: 50%;
        transform: translateX(-50%) scale(.72);
        bottom: 9%;
    }

    .sf-right {
        right: -20px;
        transform: scale(.6) rotate(5deg);
    }

    .ground {
        bottom: -5%;
        height: 31%;
    }
}

/* PANTALLAS MUY PEQUEÑAS */

@media (max-width: 380px) {

    .card {
        padding: 32px 18px;
    }

    .card h1 {
        font-size: 39px;
    }

    .card p {
        font-size: 15px;
    }

    .message h2 {
        font-size: 26px;
    }

    .message p {
        font-size: 14px;
    }

    .sf-left {
        left: -28px;
        transform: scale(.48) rotate(-5deg);
    }

    .sf-center {
        transform: translateX(-50%) scale(.62);
    }

    .sf-right {
        right: -32px;
        transform: scale(.5) rotate(5deg);
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- ESTRELLAS -->
    <div class="stars">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>

    <div class="moon"></div>

    ========================== -->

    <section class="intro" id="intro">

            </div>

            <p>

            </p>

            <button

    <!-- =========================

    ========================== -->

    <section class="garden" id="garden">

            </p>

        <!-- SUELO -->

        <div class="sunflower sf-left">

            <div class="flower">

                <div class="petals">

                    <span class="petal inner"></span>

                    <span class="petal inner"></span>

                </div>

            </div>

        </div>


        <!-- =========================

        ========================== -->

        <div class="sunflower sf-center">

            <div class="flower">

                <div class="petals">

        <!-- =========================

        <div class="sunflower sf-right">

            <div class="flower">

                <div class="petals">

<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const openButton = document.getElementById("openButton");
const intro = document.getElementById("intro");
const garden = document.getElementById("garden");

openButton.addEventListener("click", function () {

    intro.classList.add("hidden");

    setTimeout(function () {
        garden.classList.add("show");
    }, 250);

});

</script>
