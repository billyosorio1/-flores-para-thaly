<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#071326">
<title>Para Thaly ♡</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Georgia,"Times New Roman",serif;
    background:#071326;
    color:#fff;
}

.scene{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:600px;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 28%,rgba(255,214,85,.10),transparent 28%),
        linear-gradient(180deg,#050d1d 0%,#0b1830 54%,#142b20 100%);
}

/* ESTRELLAS */

.stars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.9) 0 1px,transparent 1.5px),
        radial-gradient(circle,rgba(255,224,133,.7) 0 1px,transparent 1.6px);
    background-size:82px 82px,137px 137px;
    background-position:8px 10px,41px 28px;
    opacity:.68;
}

/* LUNA */

.moon{
    position:absolute;
    top:6.5%;
    right:9%;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#fff4bc;
    box-shadow:0 0 35px rgba(255,231,145,.3);
}

.moon:after{
    content:"";
    position:absolute;
    width:52px;
    height:52px;
    border-radius:50%;
    left:13px;
    top:-6px;
    background:#071326;
}

/* =========================
   PANTALLA INICIAL
========================= */

.intro{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.card{
    width:min(88vw,380px);
    padding:34px 25px 30px;
    text-align:center;
    border-radius:28px;
    background:rgba(255,255,255,.075);
    border:1px solid rgba(255,224,113,.20);
    backdrop-filter:blur(14px);
    box-shadow:0 24px 80px rgba(0,0,0,.45);
}

.small{
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#f4db87;
}

.card h1{
    margin:13px 0 9px;
    font-size:39px;
    font-weight:500;
}

.card p{
    margin:0 0 23px;
    font:14px/1.5 Arial,sans-serif;
    color:#ddd8c7;
}

.open{
    display:inline-block;
    padding:13px 26px;
    border-radius:999px;
    background:linear-gradient(135deg,#ffe66a,#ffb52c);
    color:#2d2209;
    text-decoration:none;
    font:700 14px Arial,sans-serif;
    box-shadow:0 8px 25px rgba(255,190,45,.24);
}

#open:target ~ .intro{
    display:none;
}

#open:target ~ .garden{
    opacity:1;
    visibility:visible;
}

/* =========================
   JARDÍN
========================= */

.garden{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity .8s ease;
}

/* =========================
   MENSAJE
========================= */

.message{
    position:absolute;
    z-index:20;
    top:8.5%;
    left:50%;
    transform:translateX(-50%);
    width:min(88vw,470px);
    text-align:center;
}

.message h2{
    margin:0 0 13px;
    font-size:clamp(34px,9vw,52px);
    line-height:1.05;
    font-weight:500;
    color:#fff0a3;
    text-shadow:0 0 22px rgba(255,215,75,.22);
}

.message p{
    margin:0 auto 12px;
    max-width:430px;
    font-size:clamp(17px,4.7vw,23px);
    line-height:1.42;
    color:#fffdf3;
    text-shadow:0 2px 15px rgba(0,0,0,.45);
}

.signature{
    margin-top:11px!important;
    font:14px Arial,sans-serif!important;
    color:#e8dfc7!important;
}

/* =========================
   TERRENO
========================= */

.ground{
    position:absolute;
    left:-18%;
    bottom:-13%;
    width:136%;
    height:42%;
    border-radius:50% 50% 0 0;
    background:
        radial-gradient(ellipse at 50% 8%,#3c753a 0%,transparent 52%),
        linear-gradient(180deg,#1d4828,#071a11 78%);
    box-shadow:0 -18px 55px rgba(8,34,20,.55);
}

.grass{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:19%;
    background:linear-gradient(180deg,transparent,#071a10);
}

/* =========================
   GIRASOLES
========================= */

.sunflower{
    position:absolute;
    bottom:4%;
    width:170px;
    height:300px;
    transform-origin:50% 100%;
    animation:sway 5.5s ease-in-out infinite;
}

.sf-left{
    left:1%;
    transform:scale(.72);
    animation-delay:.4s;
}

.sf-center{
    left:50%;
    transform:translateX(-50%) scale(1.02);
    animation-delay:0s;
    z-index:4;
}

.sf-right{
    right:1%;
    transform:scale(.72);
    animation-delay:.9s;
}

@keyframes sway{
    0%,100%{rotate:-1deg}
    50%{rotate:1.4deg}
}

/* TALLOS */

.stem{
    position:absolute;
    left:82px;
    bottom:0;
    width:9px;
    height:215px;
    border-radius:10px;
    background:linear-gradient(90deg,#214c27,#71a94b,#234c27);
    transform-origin:bottom;
    animation:grow 1.35s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes grow{
    from{transform:scaleY(0)}
    to{transform:scaleY(1)}
}

/* HOJAS */

.leaf{
    position:absolute;
    width:75px;
    height:34px;
    border-radius:100% 0 100% 0;
    background:linear-gradient(135deg,#77ad4b,#24562d);
    box-shadow:inset -5px -4px 8px rgba(0,0,0,.16);
}

.leaf.a{
    left:20px;
    bottom:78px;
    rotate:-25deg;
}

.leaf.b{
    left:76px;
    bottom:122px;
    rotate:198deg;
}

.leaf.c{
    left:83px;
    bottom:49px;
    rotate:12deg;
}

/* CABEZA */

.flower-head{
    position:absolute;
    left:85px;
    top:26px;
    width:0;
    height:0;
    animation:bloom 1.25s cubic-bezier(.2,.85,.2,1) .55s both;
}

@keyframes bloom{
    from{
        transform:scale(.05) rotate(-10deg);
    }
    70%{
        transform:scale(1.06) rotate(2deg);
    }
    to{
        transform:scale(1);
    }
}

/* PÉTALOS */

.petal{
    position:absolute;
    left:-15px;
    top:-72px;
    width:30px;
    height:76px;
    border-radius:58% 58% 45% 45%;
    transform-origin:15px 72px;
    background:linear-gradient(
        90deg,
        #e9a500 0%,
        #ffd52f 38%,
        #fff07b 58%,
        #f5b300 100%
    );
    box-shadow:0 2px 5px rgba(255,186,0,.25);
}

.p1{rotate:0deg}
.p2{rotate:22.5deg}
.p3{rotate:45deg}
.p4{rotate:67.5deg}
.p5{rotate:90deg}
.p6{rotate:112.5deg}
.p7{rotate:135deg}
.p8{rotate:157.5deg}
.p9{rotate:180deg}
.p10{rotate:202.5deg}
.p11{rotate:225deg}
.p12{rotate:247.5deg}
.p13{rotate:270deg}
.p14{rotate:292.5deg}
.p15{rotate:315deg}
.p16{rotate:337.5deg}

/* PÉTALOS INTERIORES */

.petal.inner{
    width:23px;
    height:58px;
    left:-11px;
    top:-57px;
    transform-origin:11.5px 57px;
    background:linear-gradient(90deg,#ffc400,#ffe96b,#f2a900);
}

.i1{rotate:11.25deg}
.i2{rotate:56.25deg}
.i3{rotate:101.25deg}
.i4{rotate:146.25deg}
.i5{rotate:191.25deg}
.i6{rotate:236.25deg}
.i7{rotate:281.25deg}
.i8{rotate:326.25deg}

/* CENTRO CAFÉ */

.center{
    position:absolute;
    left:-29px;
    top:-29px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:
        radial-gradient(circle at 38% 35%,#a76519 0 4%,transparent 5%),
        radial-gradient(circle at 67% 62%,#5b260b 0 4%,transparent 5%),
        radial-gradient(circle,#a55712 0 38%,#70300c 70%,#3a1708 100%);
    box-shadow:0 0 13px rgba(255,181,35,.35);
}

.center:after{
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    background-image:radial-gradient(circle,#d08a25 0 1px,transparent 1.6px);
    background-size:7px 7px;
    opacity:.75;
}

/* =========================
   LUCIÉRNAGAS
========================= */

.firefly{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ffe77b;
    box-shadow:0 0 14px 4px rgba(255,222,77,.65);
    animation:fly 5s linear infinite;
}

.fire1{
    left:14%;
    bottom:30%;
}

.fire2{
    left:29%;
    bottom:22%;
    animation-delay:1.2s;
}

.fire3{
    left:67%;
    bottom:27%;
    animation-delay:2.1s;
}

.fire4{
    right:11%;
    bottom:34%;
    animation-delay:.8s;
}

.fire5{
    left:52%;
    bottom:20%;
    animation-delay:3s;
}

@keyframes fly{
    0%{
        opacity:0;
        transform:translate(0,12px);
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:.45;
    }

    100%{
        opacity:0;
        transform:translate(12px,-85px);
    }
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .moon{
        width:48px;
        height:48px;
        top:5%;
        right:8%;
    }

    .moon:after{
        width:44px;
        height:44px;
        left:11px;
        top:-5px;
    }

    .message{
        top:6%;
        width:88vw;
    }

    .message h2{
        font-size:clamp(32px,9.5vw,43px);
        margin-bottom:11px;
    }

    .message p{
        font-size:clamp(16px,4.5vw,20px);
        line-height:1.35;
        margin-bottom:9px;
    }

    .signature{
        font-size:13px!important;
    }

    .ground{
        height:37%;
        bottom:-9%;
    }

    .sunflower{
        bottom:2%;
        height:245px;
        width:145px;
    }

    .sf-left{
        left:-8%;
        transform:scale(.64);
    }

    .sf-center{
        left:50%;
        transform:translateX(-50%) scale(.78);
    }

    .sf-right{
        right:-8%;
        transform:scale(.64);
    }

    .stem{
        left:70px;
        height:180px;
        width:8px;
    }

    .flower-head{
        left:74px;
        top:25px;
    }

    .leaf{
        width:64px;
        height:29px;
    }

    .leaf.a{
        left:10px;
        bottom:65px;
    }

    .leaf.b{
        left:67px;
        bottom:102px;
    }

    .leaf.c{
        left:70px;
        bottom:43px;
    }
}

/* CELULARES PEQUEÑOS */

@media(max-width:390px){

    .message{
        top:5.5%;
    }

    .message h2{
        font-size:31px;
    }

    .message p{
        font-size:15.5px;
    }

    .signature{
        font-size:12px!important;
    }

    .sunflower{
        bottom:0;
    }

    .sf-left{
        left:-12%;
        transform:scale(.57);
    }

    .sf-center{
        transform:translateX(-50%) scale(.68);
    }

    .sf-right{
        right:-12%;
        transform:scale(.57);
    }
}

/* PANTALLAS BAJAS */

@media(max-height:700px){

    .message{
        top:4.5%;
    }

    .message h2{
        font-size:32px;
    }

    .message p{
        font-size:16px;
    }

    .sunflower{
        bottom:-4%;
    }

    .sf-left{
        transform:scale(.58);
    }

    .sf-center{
        transform:translateX(-50%) scale(.70);
    }

    .sf-right{
        transform:scale(.58);
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="stars"></div>

    <span id="open"></span>


    <!-- PANTALLA INICIAL -->

            </div>
